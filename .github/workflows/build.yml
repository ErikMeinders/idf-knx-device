name: Build example

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [v6.0, v6.1]
        target: [esp32, esp32s3, esp32c6]
        include:
          # Not in the manifest's supported range (>=6.0); built to learn
          # whether 5.5 could be supported. Allowed to fail.
          - idf: v5.5
            target: esp32c6
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      # The manifest's ">=6.0" would make the component manager refuse to
      # resolve on 5.5 before any code is compiled. Drop it in this CI copy
      # only, so the job reports whether the code itself builds.
      - name: Relax IDF version constraint (experimental job only)
        if: matrix.experimental == true
        run: |
          sed -i 's/version: ">=6.0"/version: ">=5.0"/' idf_component.yml
          grep -n '">=' idf_component.yml

      - name: Build ip_device_demo (${{ matrix.idf }}, ${{ matrix.target }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/ip_device_demo
